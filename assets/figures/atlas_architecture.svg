<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ATLAS architecture</title>
  <desc id="d">Three stages: (1) Attention Extraction with a frozen LVLM producing frame-level and video-level attention stacks; (2) Attention Adaptation with a U-Net whose bottleneck is modulated by a temporal Transformer through FiLM; (3) Segmentation and Propagation with a frozen SAM2, tracklet de-duplication, and per-frame Pearson tracklet selection.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker>
    <style>
      .stage{font-size:15px;font-weight:700;fill:#1f2a44}
      .lbl{font-size:12.5px;fill:#1f2430}
      .sm{font-size:10.5px;fill:#4b5563}
      .mono{font-family:Menlo,Consolas,monospace;font-size:10px;fill:#1f2430}
      .ln{stroke:#3b4252;stroke-width:1.6;fill:none}
      .dash{stroke:#8a94a6;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <!-- stage backgrounds -->
  <rect x="10" y="10" width="345" height="620" rx="14" fill="#f2f5fb" stroke="#d7deeb"/>
  <rect x="370" y="10" width="455" height="620" rx="14" fill="#eef6f0" stroke="#cfe3d4"/>
  <rect x="840" y="10" width="350" height="620" rx="14" fill="#fbf3ee" stroke="#ecd9cc"/>
  <text x="30" y="40" class="stage">(1) Attention Extraction</text>
  <text x="390" y="40" class="stage">(2) Attention Adaptation (trained)</text>
  <text x="860" y="40" class="stage">(3) Segmentation &amp; Propagation</text>

  <!-- ===== Stage 1 ===== -->
  <rect x="30" y="60" width="305" height="70" rx="8" fill="#fff" stroke="#c9d2e3"/>
  <text x="42" y="80" class="lbl" font-weight="700">Expression 𝓔 + extraction prompt</text>
  <text x="42" y="99" class="sm">"What is the main object (or objects)</text>
  <text x="42" y="114" class="sm">referred to…? Respond with a single word."</text>

  <rect x="30" y="142" width="305" height="54" rx="8" fill="#fff" stroke="#c9d2e3"/>
  <text x="42" y="163" class="lbl" font-weight="700">Video 𝒱 → T<tspan baseline-shift="sub" font-size="9">s</tspan> uniform keyframes</text>
  <g fill="#cbd5e1" stroke="#94a3b8"><rect x="42" y="172" width="34" height="18" rx="2"/><rect x="82" y="172" width="34" height="18" rx="2"/><rect x="122" y="172" width="34" height="18" rx="2"/><rect x="162" y="172" width="34" height="18" rx="2"/></g>
  <text x="206" y="186" class="sm">… I<tspan baseline-shift="sub" font-size="8">t₁</tspan> … I<tspan baseline-shift="sub" font-size="8">t_Ts</tspan></text>

  <rect x="30" y="210" width="305" height="150" rx="10" fill="#e3e9f6" stroke="#9fb0d3"/>
  <text x="182" y="232" class="lbl" font-weight="700" text-anchor="middle">Frozen LVLM ❄</text>
  <text x="182" y="249" class="sm" text-anchor="middle">response-token attention → visual tokens</text>
  <g>
    <rect x="45" y="260" width="135" height="88" rx="6" fill="#fff" stroke="#9fb0d3"/>
    <text x="112" y="279" class="lbl" text-anchor="middle" font-weight="700">Frame branch</text>
    <text x="112" y="296" class="sm" text-anchor="middle">T<tspan baseline-shift="sub" font-size="8">s</tspan> separate passes</text>
    <text x="112" y="311" class="sm" text-anchor="middle">1024 visual tokens</text>
    <text x="112" y="330" class="mono" text-anchor="middle">A⁽ᶠ⁾: C×R_f×W_f</text>
    <rect x="186" y="260" width="135" height="88" rx="6" fill="#fff" stroke="#9fb0d3"/>
    <text x="253" y="279" class="lbl" text-anchor="middle" font-weight="700">Video branch</text>
    <text x="253" y="296" class="sm" text-anchor="middle">1 joint pass over 𝒱ₛ</text>
    <text x="253" y="311" class="sm" text-anchor="middle">64 visual tokens</text>
    <text x="253" y="330" class="mono" text-anchor="middle">A⁽ᵛ⁾: C×R_v×W_v</text>
  </g>

  <rect x="30" y="378" width="305" height="70" rx="8" fill="#fff" stroke="#c9d2e3"/>
  <text x="42" y="398" class="lbl" font-weight="700">Stack all heads, layers ℓ = L₀ … L</text>
  <text x="42" y="415" class="sm">L₀ = middle layer;  C = (L − L₀ + 1) × H</text>
  <text x="42" y="436" class="mono">A_k = [A⁽ᶠ⁾_k ; Resize(A⁽ᵛ⁾_k)]: 2C×R_f×W_f</text>

  <!-- attention stack glyph -->
  <g transform="translate(120,470)">
    <rect x="24" y="0" width="90" height="70" fill="#7aa2e3" stroke="#3b5ea8"/>
    <rect x="16" y="8" width="90" height="70" fill="#8fb4ea" stroke="#3b5ea8"/>
    <rect x="8" y="16" width="90" height="70" fill="#a7c5f0" stroke="#3b5ea8"/>
    <rect x="0" y="24" width="90" height="70" fill="#c3d8f6" stroke="#3b5ea8"/>
    <circle cx="48" cy="58" r="14" fill="#f59e0b" opacity=".55"/><circle cx="22" cy="40" r="5" fill="#f59e0b" opacity=".45"/><circle cx="74" cy="80" r="6" fill="#f59e0b" opacity=".45"/>
  </g>
  <text x="182" y="610" class="sm" text-anchor="middle">A₁ … A_Ts (one tensor per keyframe)</text>

  <path class="ln" d="M182 196 V210" marker-end="url(#a)"/>
  <path class="ln" d="M182 130 V142" marker-end="url(#a)"/>
  <path class="ln" d="M182 360 V378" marker-end="url(#a)"/>
  <path class="ln" d="M182 448 V466" marker-end="url(#a)"/>
  <path class="ln" d="M272 520 H425 V452" marker-end="url(#a)"/>

  <!-- ===== Stage 2: U-Net ===== -->
  <rect x="385" y="70" width="80" height="380" rx="8" fill="#fff" stroke="#8cbf99"/>
  <text x="425" y="95" class="lbl" text-anchor="middle" font-weight="700">Enc-1</text>
  <text x="425" y="113" class="sm" text-anchor="middle">3×3 Conv×2</text>
  <text x="425" y="128" class="sm" text-anchor="middle">128 ch</text>
  <text x="425" y="420" class="sm" text-anchor="middle">MaxPool</text>
  <text x="425" y="436" class="sm" text-anchor="middle">2×2</text>

  <rect x="480" y="150" width="80" height="230" rx="8" fill="#fff" stroke="#8cbf99"/>
  <text x="520" y="175" class="lbl" text-anchor="middle" font-weight="700">Enc-2</text>
  <text x="520" y="193" class="sm" text-anchor="middle">3×3 Conv×2</text>
  <text x="520" y="208" class="sm" text-anchor="middle">256 ch</text>

  <rect x="575" y="200" width="75" height="130" rx="8" fill="#d8eedd" stroke="#5fa873"/>
  <text x="612" y="222" class="lbl" text-anchor="middle" font-weight="700" font-size="11.5">Bottleneck</text>
  <text x="612" y="240" class="sm" text-anchor="middle" font-size="9.5">3×3 Conv×2</text>
  <text x="612" y="258" class="mono" text-anchor="middle">Z_k: 512</text>
  <text x="612" y="272" class="sm" text-anchor="middle">×r×w</text>

  <rect x="665" y="150" width="70" height="230" rx="8" fill="#fff" stroke="#8cbf99"/>
  <text x="700" y="175" class="lbl" text-anchor="middle" font-weight="700">Dec-2</text>
  <text x="700" y="193" class="sm" text-anchor="middle">TConv +</text>
  <text x="700" y="208" class="sm" text-anchor="middle">Conv×2</text>
  <text x="700" y="223" class="sm" text-anchor="middle">256 ch</text>

  <rect x="745" y="70" width="70" height="380" rx="8" fill="#fff" stroke="#8cbf99"/>
  <text x="780" y="95" class="lbl" text-anchor="middle" font-weight="700">Dec-1</text>
  <text x="780" y="113" class="sm" text-anchor="middle">TConv +</text>
  <text x="780" y="128" class="sm" text-anchor="middle">Conv×2</text>
  <text x="780" y="143" class="sm" text-anchor="middle">128 ch</text>
  <text x="780" y="420" class="sm" text-anchor="middle">1×1 Conv</text>
  <text x="780" y="436" class="mono" text-anchor="middle">→ P_k</text>

  <path class="ln" d="M465 300 H480" marker-end="url(#a)"/>
  <path class="ln" d="M560 265 H575" marker-end="url(#a)"/>
  <path class="ln" d="M650 300 H665" marker-end="url(#a)"/>
  <path class="ln" d="M735 300 H745" marker-end="url(#a)"/>
  <!-- skips -->
  <path class="dash" d="M465 90 H745" marker-end="url(#ad)"/>
  <text x="605" y="84" class="sm" text-anchor="middle">skip</text>
  <path class="dash" d="M560 165 H665" marker-end="url(#ad)"/>
  <text x="612" y="159" class="sm" text-anchor="middle">skip</text>

  <!-- temporal branch -->
  <rect x="440" y="478" width="70" height="40" rx="6" fill="#fff" stroke="#5fa873"/>
  <text x="475" y="496" class="lbl" text-anchor="middle" font-weight="700">GAP</text>
  <text x="475" y="511" class="mono" text-anchor="middle">z_k</text>
  <rect x="520" y="464" width="112" height="68" rx="6" fill="#fff" stroke="#5fa873"/>
  <text x="576" y="481" class="lbl" text-anchor="middle" font-weight="700">Temporal</text><text x="576" y="496" class="lbl" text-anchor="middle" font-weight="700">Transformer</text>
  <text x="576" y="511" class="sm" text-anchor="middle">2 layers, 4 heads</text>
  <text x="576" y="525" class="mono" text-anchor="middle">z̃₁ … z̃_Ts</text>
  <rect x="658" y="470" width="150" height="56" rx="6" fill="#fff" stroke="#5fa873"/>
  <text x="733" y="490" class="lbl" text-anchor="middle" font-weight="700">Linear → γ_k, β_k</text>
  <text x="733" y="510" class="sm" text-anchor="middle">FiLM params (512-d)</text>
  <rect x="540" y="560" width="270" height="44" rx="6" fill="#d8eedd" stroke="#5fa873"/>
  <text x="675" y="580" class="lbl" text-anchor="middle" font-weight="700">FiLM modulation</text>
  <text x="675" y="596" class="mono" text-anchor="middle">Z′_k = Z_k ⊙ (1 + γ_k) + β_k</text>

  <path class="ln" d="M600 330 V400 H475 V478" marker-end="url(#a)"/>
  <path class="ln" d="M510 498 H520" marker-end="url(#a)"/>
  <path class="ln" d="M632 498 H658" marker-end="url(#a)"/>
  <path class="ln" d="M733 526 V545 H700 V560" marker-end="url(#a)"/>
  <path class="ln" d="M645 560 V330" marker-end="url(#a)"/>
  <text x="388" y="622" class="sm">Loss: BCE + Soft Dice</text>

  <!-- P_k heatmap -->
  <path class="ln" d="M815 260 H836 V94 H860" marker-end="url(#a)"/>

  <!-- ===== Stage 3 ===== -->
  <g transform="translate(862,62)">
    <rect width="96" height="64" rx="4" fill="#1e3a8a"/>
    <ellipse cx="50" cy="34" rx="22" ry="16" fill="#ef4444" opacity=".9"/>
    <ellipse cx="50" cy="34" rx="34" ry="24" fill="#f59e0b" opacity=".35"/>
    <circle cx="50" cy="34" r="3.5" fill="#fff" stroke="#111"/>
  </g>
  <text x="970" y="82" class="lbl" font-weight="700">Localization map P_k</text>
  <text x="970" y="100" class="mono">p_k = argmax P_k(u,v)</text>
  <text x="970" y="117" class="sm">one positive point per keyframe</text>

  <rect x="860" y="200" width="310" height="60" rx="10" fill="#f7e2d4" stroke="#d9a483"/>
  <text x="1015" y="225" class="lbl" text-anchor="middle" font-weight="700">Frozen SAM2 ❄</text>
  <text x="1015" y="244" class="sm" text-anchor="middle">point prompts → keyframe masks → propagate</text>

  <rect x="860" y="290" width="310" height="90" rx="8" fill="#fff" stroke="#e1c3ae"/>
  <text x="872" y="311" class="lbl" font-weight="700">Propagation-based seed de-duplication</text>
  <text x="872" y="329" class="sm">propagate earliest seed; drop later seed k if</text>
  <text x="872" y="345" class="sm">IoU(propagated mask, seed mask at k) &gt; τ = 0.8;</text>
  <text x="872" y="361" class="sm">repeat → M tracklets 𝒯₁ … 𝒯_M</text>

  <rect x="860" y="410" width="310" height="96" rx="8" fill="#fff" stroke="#e1c3ae"/>
  <text x="872" y="431" class="lbl" font-weight="700">Tracklet selection</text>
  <text x="872" y="452" class="mono">m* = argmax_m (1/T_s) Σ_k ρ(V_m,k, P_k)</text>
  <text x="872" y="471" class="sm">ρ: per-keyframe Pearson correlation</text>
  <text x="872" y="487" class="sm">max ρ &lt; 0.1 → empty mask</text>

  <rect x="860" y="534" width="310" height="70" rx="8" fill="#fbe1cf" stroke="#d9a483"/>
  <text x="1015" y="560" class="lbl" text-anchor="middle" font-weight="700">Output masks 𝓜 = {M_t}, all T frames</text>
  <text x="1015" y="580" class="sm" text-anchor="middle">final segmentation = tracklet 𝒯_m*</text>

  <path class="ln" d="M1015 130 V200" marker-end="url(#a)"/>
  <path class="ln" d="M1015 260 V290" marker-end="url(#a)"/>
  <path class="ln" d="M1015 380 V410" marker-end="url(#a)"/>
  <path class="ln" d="M1015 506 V534" marker-end="url(#a)"/>
</svg>
